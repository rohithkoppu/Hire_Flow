server.port=8085
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[1].id=candidate-service
spring.cloud.gateway.routes[1].uri=lb://candidate-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/candidates/**
spring.cloud.gateway.routes[2].id=interview-service
spring.cloud.gateway.routes[2].uri=lb://interview-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/interviews/**
